<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For my favourite Hooman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1424;--wine:#7a1637;--plum:#2a0f3d;--night:#0d0614;--neon:#ff4d8d;--cyan:#6ee7ff;--paper:#fff6dc;--text:#fbe8ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--night);color:var(--text);font-family:Quicksand,system-ui,sans-serif;overflow:hidden;color-scheme:dark}
.scr{position:fixed;inset:0;height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
background:radial-gradient(120% 80% at 50% 0%,#4a1245 0%,var(--plum) 40%,var(--night) 100%)}
.scr.on{display:flex;animation:fade 1s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:overlay;
background-image:repeating-radial-gradient(circle at 30% 20%,#fff 0 1px,transparent 1px 3px)}
.char{width:min(46vw,190px);border-radius:50%;border:3px solid var(--neon);box-shadow:0 0 40px #ff4d8d88;animation:wave 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wave{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-8px)}}
h1{font-family:Caveat,cursive;font-size:clamp(38px,11vw,60px);margin:22px 0 10px;text-shadow:0 0 18px var(--neon);min-height:1.2em}
.sub{max-width:420px;font-size:clamp(15px,4.3vw,17px);line-height:1.6;opacity:0;transition:opacity 1s;min-height:110px}
.sub.show{opacity:1}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:13px 26px;color:#fff;background:linear-gradient(135deg,var(--neon),var(--wine));box-shadow:0 6px 24px #ff4d8d55}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#tap,#go{display:none;margin-top:14px}
#door{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000;perspective:900px}
#door.on{display:flex}
#door .glow{position:absolute;inset:0;background:radial-gradient(circle,#ffd1e8,#ff4d8d 40%,#2a0f3d 80%);opacity:0;transition:opacity 1.4s}
#door.open .glow{opacity:1}
.frame{position:relative;width:min(48vw,200px);height:min(80vw,330px);background:#ffc7e0;border:8px solid #3b1b2c;border-radius:90px 90px 0 0;perspective:700px}
.leaf{position:absolute;inset:0;background:#8a3b5c;border-radius:80px 80px 0 0;transform-origin:left center;transition:transform 1.3s cubic-bezier(.6,0,.3,1)}
.leaf::after{content:"";position:absolute;right:16px;top:55%;width:14px;height:14px;border-radius:50%;background:#ffd166}
#door.open .leaf{transform:rotateY(-110deg)}
/* room */
#room{background:linear-gradient(#2b0a3d 0 60%,#1a0826 60%)}
#room::after{display:none}
.stage{position:relative;width:100%;height:100%;max-width:760px;margin:auto}
.moon{position:absolute;left:6%;top:9%;width:40%;aspect-ratio:588/354;border:5px solid #5a2c46;border-radius:6px;background:#000;overflow:hidden;box-shadow:0 0 26px #6ee7ff55,inset 0 0 12px #000}
.moon img{width:100%;height:100%;object-fit:cover;display:block}
.sign{position:absolute;right:6%;top:8%;font-family:Caveat;font-size:clamp(20px,6vw,34px);color:var(--cyan);text-shadow:0 0 12px var(--cyan);transform:rotate(4deg)}
.shelf{position:absolute;left:6%;top:36%;width:40%;height:3%;background:#5a2c46;border-radius:3px}
.books{position:absolute;left:8%;top:28.5%;width:36%;height:7.5%;display:flex;align-items:flex-end;gap:3px}
.books i{flex:1;border-radius:2px 2px 0 0}
.rug{position:absolute;left:12%;right:12%;bottom:3%;height:16%;border-radius:50%;background:radial-gradient(#6a1f58,#3a1050 70%);opacity:.8}
.obj{position:absolute;background:none;box-shadow:none;padding:0;border-radius:12px;line-height:1;transition:transform .2s,filter .2s;filter:drop-shadow(0 0 10px #ff4d8d88)}
.obj:hover{transform:scale(1.12)}
.obj.seen{filter:drop-shadow(0 0 4px #ffffff33) saturate(.6)}
.obj.pillow{width:clamp(54px,15vw,84px);aspect-ratio:1;background:radial-gradient(circle at 35% 30%,#3a3446,#0b0810 70%);border:1px solid #4a4058;border-radius:28% 32% 26% 30%}
.deco{position:absolute;pointer-events:none;line-height:1}
#note{position:fixed;left:50%;top:44%;width:min(82vw,340px);padding:26px 22px 22px;background:var(--paper);color:var(--ink);font-family:Caveat,cursive;font-weight:700;font-size:clamp(23px,6.5vw,30px);line-height:1.25;
transform:translate(-50%,-50%) rotate(-2deg) scale(.4);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.3,1.5,.5,1);z-index:10;box-shadow:0 18px 50px #000a;border-radius:3px;
background-image:repeating-linear-gradient(transparent 0 33px,#e7c9a455 33px 34px)}
#note.on{transform:translate(-50%,-50%) rotate(-2deg) scale(1);opacity:1;pointer-events:auto}
#note small{display:block;margin-top:12px;font-size:17px;color:#8a5b6f;font-weight:500}
#note::before{content:"";position:absolute;left:50%;top:-11px;width:70px;height:22px;background:#ff4d8d99;transform:translateX(-50%) rotate(2deg)}
#leave{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;padding:10px 18px;font-size:14px}
.hint{position:absolute;left:0;right:0;top:calc(2% + env(safe-area-inset-top,0px));font-size:14px;opacity:.7}
.q h1{font-size:clamp(34px,9vw,50px)}
.qimg{width:min(54vw,230px);border-radius:24px;border:3px solid var(--cyan);box-shadow:0 0 36px #6ee7ff66;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:12px;width:min(88vw,320px);margin-top:12px}
.opts button,#tap,#go{min-height:48px;font-size:16px}
#msg{margin-top:18px;min-height:56px;font-size:19px;font-weight:700;max-width:340px}
.hug{position:fixed;bottom:-50px;font-size:34px;animation:up var(--d) linear forwards;z-index:30;pointer-events:none}
@keyframes up{to{transform:translateY(-115vh) rotate(var(--r));opacity:.3}}
@media (max-height:640px){.char,.qimg{width:min(30vw,120px)}h1{margin:12px 0 6px}.sub{min-height:90px}#msg{margin-top:8px;min-height:44px}.opts{gap:8px}}
@media (max-width:360px){.sign{font-size:18px}}
@media (prefers-reduced-motion:reduce){.char{animation:none}.hug{animation-duration:6s}}
</style>
</head>
